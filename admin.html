<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Portfolio</title>
<link rel="stylesheet" href="styles/main.css">
<style>
.wrap{max-width:980px;margin:auto;padding:2rem 1.25rem 5rem;position:relative;z-index:1}
.bar{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center;margin-bottom:1rem}.bar h1{font-size:1.6rem}
.note{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:1rem;color:var(--mu);font-size:.9rem;margin-bottom:1.5rem}.note b{color:var(--tx)}
.tabs{display:flex;gap:.5rem;margin-bottom:1.5rem}.btn.on{background:var(--tx);color:#000}
.item{display:grid;grid-template-columns:84px 1fr auto;gap:1rem;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:.8rem;margin-top:.75rem}
.item.off{opacity:.5}.item img,.item .ph{width:84px;height:64px;border-radius:12px;object-fit:cover;background:var(--s2)}
.item h3{font-size:1.05rem}.item small{color:var(--mu)}.acts{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:flex-end}.acts .btn{padding:.35rem .7rem;min-height:36px;font-size:.82rem}
@media(max-width:640px){.item{grid-template-columns:64px 1fr}.item img,.item .ph{width:64px;height:54px}.acts{grid-column:1/-1;justify-content:flex-start}}
dialog{width:min(640px,94vw);max-height:92vh;border:1px solid var(--line);border-radius:22px;background:var(--s1);color:var(--tx);padding:0}
dialog::backdrop{background:rgba(0,0,0,.75)}dialog form{border:0;border-radius:0;background:none;max-height:90vh;overflow:auto}
.chk{display:flex;gap:1.5rem;flex-wrap:wrap}.chk label{display:flex;align-items:center;gap:.5rem;grid-template:none;color:var(--tx)}.chk input{width:auto}
.thumbs{display:flex;gap:.5rem;flex-wrap:wrap}.thumbs img{width:64px;height:64px;border-radius:10px;object-fit:cover;cursor:pointer;border:1px solid var(--line)}
.prev{max-height:120px;border-radius:12px;margin-top:.4rem}.grp{display:grid;gap:1rem;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:1.4rem;margin-bottom:1rem}
.grp h3{font-size:1rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar"><h1>Portfolio admin</h1>
    <div class="cta"><a class="btn" href="index.html">View site</a><button class="btn pri" id="exp" type="button">Export files</button></div></header>
  <p class="note"><b>Changes save in this browser and show on your site here immediately.</b> To publish them for every visitor, click <b>Export files</b> and replace <code>data/projects.js</code> and <code>data/profile.js</code> with the downloaded ones, then redeploy.</p>
  <div class="tabs"><button class="btn on" data-t="projects" type="button">Projects</button><button class="btn" data-t="profile" type="button">Profile</button></div>
  <div id="tab-projects"><button class="btn pri" id="add" type="button">+ New project</button><div id="list"></div></div>
  <div id="tab-profile" hidden><div id="pf"></div><button class="btn" id="reset" type="button">Reset all local changes</button></div>
</div>

<dialog id="dlg"><form id="pj" method="dialog">
  <h3 id="dt">Project</h3>
  <label>Name<input name="name" required></label>
  <div class="row"><label>Category<input name="category" placeholder="Mobile, Backend, Web..."></label><label>Date<input name="date" placeholder="2026-11"></label></div>
  <label>Short description<input name="shortDescription"></label>
  <label>Full description<textarea name="fullDescription"></textarea></label>
  <label>Cover image<input type="file" id="img" accept="image/*"></label><img id="imgprev" class="prev" alt="" hidden>
  <label>Screenshots (you can pick several; click a thumbnail to remove it)<input type="file" id="shots" accept="image/*" multiple></label><div class="thumbs" id="thumbs"></div>
  <label>Technologies (comma separated)<input name="technologies" placeholder="Flutter, Firebase"></label>
  <div class="row"><label>GitHub URL<input name="github" type="url"></label><label>Live demo URL<input name="liveDemo" type="url"></label></div>
  <div class="row"><label>Case study URL<input name="caseStudy" type="url"></label><label>Video / demo URL<input name="video" type="url"></label></div>
  <div class="chk"><label><input type="checkbox" name="featured"> Featured</label><label><input type="checkbox" name="visible"> Visible on site</label></div>
  <div class="cta"><button class="btn pri" type="submit">Save project</button><button class="btn" type="button" id="cancel">Cancel</button></div>
</form></dialog>

<script src="data/profile.js"></script><script src="data/projects.js"></script><script src="js/api.js"></script><script src="js/admin.js"></script>
</body>
</html>
